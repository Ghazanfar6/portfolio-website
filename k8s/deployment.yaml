apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-app
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: portfolio-app

  template:
    metadata:
      labels:
        app: portfolio-app

    spec:
      containers:
      - name: portfolio-app

        image: ghazanfar6/portfolioweb-app:latest

        ports:
        - containerPort: 8081

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "500m"
